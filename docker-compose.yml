version: '3.8'
services:
  backend:
    build: ./fotocopiadora_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/fotocopiadora
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - db
  frontend:
    build: ./fotocopiadora_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fotocopiadora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
